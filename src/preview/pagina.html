<title>Prévia Vinheta MSJ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: cabeçalho com as versões; palco com o player 16:9 e, ao lado, a lista de telas para pular direto. */
  @font-face { font-family: "Agibank Sans"; src: url("brand/fonts/AgibankSans-Regular.woff2") format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "Agibank Sans"; src: url("brand/fonts/AgibankSans-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: swap; }
  @font-face { font-family: "Agibank Sans"; src: url("brand/fonts/AgibankSans-Bold.woff2") format("woff2"); font-weight: 700; font-display: swap; }
  :root {
    --fundo: #F3F3F3;
    --superficie: #FFFFFF;
    --texto: #000F44;
    --suave: #4A5578;
    --azul: #0064F5;
    --linha: #DCE1EC;
    --verde: #77DF40;
    --fonte: "Agibank Sans", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --fundo: #000F44; --superficie: #071A5C; --texto: #FFFFFF; --suave: #B7C3E6; --azul: #5C9BFF; --linha: #1F3478; --verde: #77DF40; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --fundo: #000F44; --superficie: #071A5C; --texto: #FFFFFF; --suave: #B7C3E6; --azul: #5C9BFF; --linha: #1F3478; --verde: #77DF40; color-scheme: dark;
  }
  body { background: var(--fundo); color: var(--texto); font-family: var(--fonte); font-size: 15px; }
  .pagina {
    max-width: 1500px; margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 24px 40px;
    display: grid; gap: 20px;
  }
  .topo { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; }
  .sobre { margin: 0 0 4px; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--suave); }
  h1 { margin: 0; font-size: clamp(24px, 3vw, 34px); font-weight: 700; text-wrap: balance; }
  .abas { display: flex; flex-wrap: wrap; gap: 8px; }
  .aba {
    font: 600 14px/1 var(--fonte); color: var(--texto); background: var(--superficie);
    border: 1px solid var(--linha); border-radius: 14px; padding: 11px 14px; cursor: pointer;
  }
  .aba[aria-pressed="true"] { background: var(--azul); border-color: var(--azul); color: #FFFFFF; }
  .aba:focus-visible, .cap:focus-visible { outline: 3px solid var(--verde); outline-offset: 2px; }
  .palco { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: start; }
  @media (max-width: 960px) { .palco { grid-template-columns: minmax(0, 1fr); } }
  .tela { min-width: 0; border-radius: 14px; overflow: hidden; background: #000F44; }
  .lateral { min-width: 0; display: grid; gap: 12px; }
  .nota { margin: 0; line-height: 1.45; }
  .tempo { margin: 0; font-variant-numeric: tabular-nums; color: var(--suave); }
  .tempo span { color: var(--texto); font-weight: 700; font-size: 20px; }
  .capitulos { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; max-height: 60vh; overflow-y: auto; }
  .cap {
    width: 100%; display: flex; gap: 12px; align-items: baseline; text-align: left;
    font: 400 15px/1.3 var(--fonte); color: var(--texto); background: transparent;
    border: 0; border-radius: 12px; padding: 9px 10px; cursor: pointer;
  }
  .cap:hover { background: var(--superficie); }
  .cap[aria-current="step"] { background: var(--superficie); box-shadow: inset 3px 0 0 var(--azul); font-weight: 600; }
  .cap-t { font-variant-numeric: tabular-nums; color: var(--suave); min-width: 44px; }
  .aviso { margin: 0; font-size: 13px; line-height: 1.45; color: var(--suave); }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
</style>
<div id="app"><p style="padding: 24px">Carregando a prévia…</p></div>
<script src="app.js"></script>
