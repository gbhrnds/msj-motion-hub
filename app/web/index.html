<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estúdio de Motion</title>
<style>
  @font-face { font-family: "Agibank Sans"; src: url("/brand/fonts/AgibankSans-Regular.woff2") format("woff2"); font-weight: 400; }
  @font-face { font-family: "Agibank Sans"; src: url("/brand/fonts/AgibankSans-SemiBold.woff2") format("woff2"); font-weight: 600; }
  @font-face { font-family: "Agibank Sans"; src: url("/brand/fonts/AgibankSans-Bold.woff2") format("woff2"); font-weight: 700; }
  :root {
    --fundo: #F3F3F3; --superficie: #FFFFFF; --texto: #000F44; --suave: #4A5578;
    --azul: #0064F5; --azul-medio: #0033B0; --linha: #DCE1EC; --verde: #77DF40; --erro: #B00020;
    --fonte: "Agibank Sans", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fundo); color: var(--texto); font: 400 15px/1.45 var(--fonte); }
  button, input, select, textarea { font: inherit; color: inherit; }
  .topo { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 14px 20px; background: var(--superficie); border-bottom: 1px solid var(--linha); }
  .topo h1 { margin: 0 12px 0 0; font-size: 20px; font-weight: 700; }
  .grade { display: grid; grid-template-columns: minmax(340px, 440px) minmax(0, 1fr); gap: 16px; padding: 16px 20px; height: calc(100vh - 66px); }
  @media (max-width: 960px) { .grade { grid-template-columns: 1fr; height: auto; } }
  .caixa { background: var(--superficie); border: 1px solid var(--linha); border-radius: 14px; min-width: 0; }
  .chat { display: flex; flex-direction: column; min-height: 520px; }
  .mensagens { flex: 1; overflow-y: auto; padding: 16px; display: grid; gap: 10px; align-content: start; }
  .msg { padding: 10px 12px; border-radius: 12px; max-width: 92%; white-space: pre-wrap; }
  .msg.voce { background: var(--azul); color: #fff; justify-self: end; }
  .msg.estudio { background: var(--fundo); justify-self: start; }
  .msg small { display: block; opacity: .75; margin-top: 4px; font-size: 12px; }
  .entrada { border-top: 1px solid var(--linha); padding: 12px; display: grid; gap: 8px; }
  .entrada textarea { width: 100%; min-height: 64px; resize: vertical; border: 1px solid var(--linha); border-radius: 12px; padding: 10px; }
  .linha { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .botao { border: 0; border-radius: 12px; padding: 10px 14px; background: var(--azul); color: #fff; font-weight: 600; cursor: pointer; }
  .botao.sec { background: var(--superficie); color: var(--texto); border: 1px solid var(--linha); }
  .botao:disabled { opacity: .5; cursor: default; }
  .botao:focus-visible, textarea:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--verde); outline-offset: 2px; }
  .anexo { font-size: 13px; background: var(--fundo); border-radius: 12px; padding: 4px 10px; }
  .soltar { outline: 3px dashed var(--azul); outline-offset: -8px; }
  .direita { display: grid; gap: 16px; grid-template-rows: auto 1fr; min-height: 0; }
  .tela { border-radius: 14px; overflow: hidden; background: #000F44; }
  .vazio { aspect-ratio: 16 / 9; display: grid; place-items: center; color: #fff; padding: 24px; text-align: center; }
  .painel { padding: 14px 16px; overflow-y: auto; }
  .painel h2 { font-size: 16px; margin: 0 0 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td, th { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--linha); vertical-align: top; }
  th { color: var(--suave); font-weight: 600; }
  .barra { height: 10px; border-radius: 12px; background: var(--fundo); overflow: hidden; }
  .barra div { height: 100%; background: var(--azul); }
  .aviso { color: var(--erro); }
  .suave { color: var(--suave); }
  input[type=text], select { border: 1px solid var(--linha); border-radius: 12px; padding: 8px 10px; background: var(--superficie); }
</style>
</head>
<body>
<div id="app"></div>
<script src="/app.js"></script>
</body>
</html>
