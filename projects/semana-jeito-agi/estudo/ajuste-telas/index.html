<title>Ajuste Semana do Jeito Agi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: barra de telas no topo, palco 1920x1080 em escala à esquerda, painel de propriedades à direita (empilha no celular). Visual único escuro, para o palco ser o único ponto de cor. */
@font-face{font-family:AS;font-weight:300;src:url(assets/AgibankSans-Light.woff2) format("woff2")}
@font-face{font-family:AS;font-weight:400;src:url(assets/AgibankSans-Regular.woff2) format("woff2")}
@font-face{font-family:AS;font-weight:500;src:url(assets/AgibankSans-Medium.woff2) format("woff2")}
@font-face{font-family:AS;font-weight:700;src:url(assets/AgibankSans-Bold.woff2) format("woff2")}
:root{
  color-scheme:dark;
  --chrome:#0B1020; --chrome-2:#121933; --linha:#26305A; --texto:#E7EBF7; --texto-2:#9AA4C7; --sel:#7CF0FF; --ok:#77DF40; --aviso:#FFD600;
  --azul:#0064F5; --medio:#0033B0; --escuro:#000F44; --verde:#77DF40; --vclaro:#C9FF90; --amarelo:#FFD600; --branco:#FFFFFF;
  --ui:AS,Arial,sans-serif;
}
*{box-sizing:border-box}
body{background:var(--chrome);color:var(--texto);font-family:var(--ui);font-size:14px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 32px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;margin-bottom:12px}
h1{font-size:18px;font-weight:700;margin:0;letter-spacing:.01em}
.status{font-size:12px;color:var(--texto-2);display:flex;align-items:center;gap:6px}
.status i{width:8px;height:8px;border-radius:4px;background:var(--texto-2);display:inline-block}
.status.ok i{background:var(--ok)} .status.pend i{background:var(--aviso)} .status.err i{background:#ff6b6b}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.tab{flex:0 0 auto;background:var(--chrome-2);border:1px solid var(--linha);color:var(--texto);border-radius:10px;padding:6px;cursor:pointer;display:flex;flex-direction:column;gap:5px;align-items:flex-start;font:500 12px var(--ui)}
.tab canvas,.tab .mini{width:128px;height:72px;border-radius:4px;display:block;background:#222}
.tab[aria-current="true"]{border-color:var(--sel);box-shadow:0 0 0 1px var(--sel)}
.tab .dot{width:6px;height:6px;border-radius:3px;background:var(--aviso);display:inline-block;margin-left:4px}
.main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
@media (max-width:900px){.main{grid-template-columns:minmax(0,1fr)}}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px;font-size:12px;color:var(--texto-2)}
.toolbar label{display:flex;gap:6px;align-items:center;cursor:pointer}
button{font:500 12px var(--ui);color:var(--texto);background:var(--chrome-2);border:1px solid var(--linha);border-radius:8px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--texto-2)} button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--sel);outline-offset:1px}
button.prim{background:var(--azul);border-color:var(--azul);color:#fff}
.stagebox{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;background:#000;border-radius:6px;overflow:hidden;touch-action:none}
.stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:#fff;font-family:AS,Arial,sans-serif}
.el{position:absolute}
.el.sel{outline:3px solid var(--sel);outline-offset:-1px;z-index:900}
.el.hov{outline:2px dashed rgba(124,240,255,.6);outline-offset:-1px}
.handle{position:absolute;width:26px;height:26px;right:-13px;bottom:-13px;background:var(--sel);border:3px solid #001;border-radius:4px;cursor:nwse-resize;z-index:901}
.grid{position:absolute;inset:0;pointer-events:none;z-index:800;background-image:linear-gradient(to right,rgba(255,0,140,.75) 2px,transparent 2px),linear-gradient(to bottom,rgba(255,0,140,.75) 2px,transparent 2px);background-size:384px 360px}
.ghost{position:absolute;color:#fff;opacity:.41;font-weight:300;font-size:58px;line-height:61px;white-space:nowrap;left:16px}
.txt{position:absolute;display:flex;line-height:1.14}
.txt>.conteudo{width:100%}
.vc{color:var(--vclaro)}
.op{border-radius:50%;background:#fff;color:var(--escuro);font-weight:700;display:flex;align-items:center;justify-content:center}
.panel{background:var(--chrome-2);border:1px solid var(--linha);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{font-size:13px;margin:0;color:var(--texto-2);font-weight:500;letter-spacing:.06em;text-transform:uppercase}
.panel .nome{font-size:16px;font-weight:700;margin-top:4px}
.row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.f{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--texto-2);min-width:0}
input,select,textarea{font:400 13px var(--ui);color:var(--texto);background:var(--chrome);border:1px solid var(--linha);border-radius:6px;padding:5px 6px;width:100%;min-width:0;font-variant-numeric:tabular-nums}
input[type=range]{padding:0}
input[type=checkbox]{width:auto}
textarea{min-height:84px;resize:vertical}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.sw{width:30px;height:30px;border-radius:6px;border:2px solid var(--linha);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{border-color:var(--sel);box-shadow:0 0 0 2px var(--sel)}
.lista{display:flex;flex-direction:column;gap:2px;max-height:220px;overflow:auto;border:1px solid var(--linha);border-radius:8px;padding:4px}
.lista button{text-align:left;border:0;background:transparent;padding:4px 6px;border-radius:5px;display:flex;justify-content:space-between;gap:6px}
.lista button[aria-current="true"]{background:var(--linha)}
.lista button .k{color:var(--texto-2);font-size:11px}
.copy{font-size:12px;color:var(--texto-2);background:var(--chrome);border:1px solid var(--linha);border-radius:8px;padding:8px;line-height:1.4}
.marquee{position:absolute;border:3px dashed var(--sel);background:rgba(124,240,255,.12);z-index:950;pointer-events:none}
.alinha{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}.alinha button{font-size:16px;padding:4px 0}
.lrow{display:flex;gap:4px;align-items:center}.lrow>button:first-child{flex:1;min-width:0}
.mini-btn{font-size:11px;padding:2px 6px}
button.perigo{border-color:#ff6b6b;color:#ffb3b3}
.hint{font-size:11.5px;color:var(--texto-2);line-height:1.45}
.confirm{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <h1>Ajuste · Semana do Jeito Agi</h1>
    <span class="status" id="status" role="status"><i></i><span id="statusTxt">Conectando…</span></span>
    <span style="flex:1"></span>
    <button id="btnCopiar" type="button">Copiar JSON da tela</button>
  </header>

  <nav class="tabs" id="tabs" aria-label="Telas"></nav>

  <div class="main">
    <section style="min-width:0">
      <div class="toolbar">
        <label><input type="checkbox" id="optGrade" checked> Grade 5×3</label>
        <label><input type="checkbox" id="optIma" checked> Ímã na grade</label>
        <button type="button" id="btnDesfazer">Desfazer (Ctrl+Z)</button>
        <span>Shift+clique ou caixa a partir do fundo = vários · Delete exclui · setas 1px (Shift 10px) · Alt solta o ímã · Esc limpa</span>
      </div>
      <div class="stagebox" id="stagebox"><div class="stage" id="stage"></div></div>
      <div class="f" style="margin-top:12px">
        <label for="nota" style="font-size:12px;color:var(--texto)">Observações desta tela (eu leio junto com os ajustes)</label>
        <textarea id="nota" placeholder="Ex.: quero o título mais perto do topo; a foto pode ser a CAN_9307…"></textarea>
      </div>
    </section>

    <aside class="panel" id="panel" aria-label="Propriedades">
      <div><h2>Elemento</h2><div class="nome" id="pNome">Nenhum selecionado</div></div>
      <div id="pCampos" class="hint">Clique num elemento do palco ou da lista abaixo.</div>
      <div><h2 style="margin-bottom:6px">Camadas</h2><div class="lista" id="lista"></div></div>
      <div class="confirm" id="resetBox"></div>
    </aside>
  </div>
</div>

<script>
(()=>{
const C=384,R=360;
const COR={azul:'#0064F5',medio:'#0033B0',escuro:'#000F44',verde:'#77DF40',vclaro:'#C9FF90',amarelo:'#FFD600',branco:'#FFFFFF'};
const NOMECOR={azul:'Azul Agibank',medio:'Azul médio',escuro:'Azul escuro',verde:'Verde',vclaro:'Verde claro',amarelo:'Amarelo',branco:'Branco'};
const FOTOS=['CAN_0009','CAN_0024','CAN_0089','CAN_0292','CAN_0504','CAN_0521-2','CAN_0527-2','CAN_0819','CAN_9307','CAN_9478','CAN_9577','CAN_9803','CAN_9981','CAN_9999','CAN_mesa-redonda-dupla','DSC04607','DSC09735','OB_A0001-63','PI_A0001-23','BAIXA_colaboradora-tela-nyse','BAIXA_time-mesa-campus'];
const NB=' ';

// ---------- telas padrão (frame style v1 + respiro só com logo da Semana)
const rect=(id,nome,x,y,w,h,cor,extra={})=>({id,nome,tipo:'modulo',x,y,w,h,cor,textura:false,...extra});
const cac=(id,nome,x,y,w,h,ix,iy,iw,variante='medio',flip=false)=>({id,nome,tipo:'cacos',x,y,w,h,ix,iy,iw,variante,flip});
const txt=(id,nome,x,y,w,h,size,peso,cor,html,extra={})=>({id,nome,tipo:'texto',x,y,w,h,size,peso,cor,html,valign:'top',align:'left',...extra});
const timer=(id,x,y,w,h,size,fundo='escuro',valor='14:12')=>({id,nome:'Timer',tipo:'timer',x,y,w,h,size,fundo,cor:'branco',valor});
const img=(id,nome,src,x,y,w,h)=>({id,nome,tipo:'imagem',src,x,y,w,h});

const RB={'CAN_9999':[547,301,1235,1066],'CAN_0024':[115,214,1269,1066],'CAN_0504':[6,95,1563,1066],'BAIXA_time-mesa-campus':[44,149,1519,950],'CAN_0009':[357,403,1116,1019],'PI_A0001-23':[413,321,1395,1066],'OB_A0001-63':[469,234,1600,1066]};
VAZA['PI_A0001-23']=[1600,1066];VAZA['OB_A0001-63']=[1600,1066];
// Par separado: foto com fundo mascarada no módulo (atrás) + recorte da mesma foto (na frente), alinhados por padrão.
const fotoPar=(src,x,y,w,h,k,ix,iy)=>{const b=RB[src];return [
  {id:'foto-fundo',nome:'Foto com fundo (máscara) · '+src,tipo:'fotomask',src,x,y,w,h,ix,iy,iw:Math.round(1600*k)},
  {id:'recorte',nome:'Recorte (na frente) · '+src,tipo:'recorte',src,x:Math.round(x+ix+b[0]*k),y:Math.round(y+iy+b[1]*k),w:Math.round((b[2]-b[0])*k),h:Math.round((b[3]-b[1])*k)}];};
const fv=(id,src,x,y,w,h,esc,ix,iy,vaza={})=>({id,nome:'Foto com vazamento ('+src+')',tipo:'fotovaza',src,x,y,w,h,ix,iy,iw:Math.round(VAZA[src][0]*esc),vt:0,ve:0,vd:0,vb:0,...vaza});
function pilar({id,nome,logo,rep,bul,ys,hs,acento,txtCor,bolaCor,foto:fo,lado,valor,fw=2*C}){
  const dir=lado==='dir';
  const topoX=dir?0:520, topoW=632, cacX=dir?3*C:0, cacW=dir?C:520, repX=dir?topoX+topoW+56:3*C+56, repW=dir?3*C-repX-40:C-96;
  const bx=dir?0:fw, fx=dir?1920-fw:0, bw=1920-fw, H=160, lw=Math.round(H*LOGO_RATIO[logo]);
  const els=[rect('fundo','Fundo',0,0,1920,1080,'branco'),
    rect('modulo-topo','Módulo do logo do pilar',topoX,0,topoW,R,'azul'),
    img('logo-pilar','Logo do pilar',LOGOS[logo],topoX+44,100,lw,H),
    txt('texto-representa','Representa…',repX,128,repW,120,44,300,'azul',rep),
    rect('modulo-cacos','Módulo dos cacos',cacX,0,cacW,R,'branco'),
    cac('cacos-1','Cacos',cacX,0,cacW,R,dir?-60:-120,dir?-120:-160,dir?560:640,'medio'),
    timer('timer',4*C,0,C,R,112,'escuro',valor),
    rect('modulo-pessoa','Módulo atrás da foto',fx,R,fw,2*R,'azul'),
    rect('modulo-bullets','Módulo dos bullets',bx,R,bw,2*R,acento)];
  const dX=bw<3*C?70:95, tX=bw<3*C?112:152, tW=bw<3*C?820:880;
  bul.forEach((t,i)=>els.push(bola('bolinha-'+(i+1),'Bullet '+(i+1)+' · bolinha',bx+dX,ys[i]+17,bolaCor),
    txt('texto-bullet-'+(i+1),'Bullet '+(i+1)+' · texto',bx+tX,ys[i],tW,hs[i],46,400,txtCor,t)));
  const [ff,rc]=fotoPar(fo.src,fx,R,fw,2*R,fo.k,fo.ix,fo.iy);
  els.splice(els.findIndex(e=>e.id==='modulo-pessoa')+1,0,ff);
  els.splice(els.findIndex(e=>e.id==='modulo-bullets')+1,0,rc);
  return {id,nome,els};
}
function respiro(id,nome,fundo,modTimer,acento,valor,variante){
  const lw=212,lh=Math.round(lw/SEMANA_R);
  return {id,nome,els:[rect('fundo','Fundo',0,0,1920,1080,fundo),
    cac('cacos-esq-1','Cacos esquerda 1',0,0,C,1080,-380,-20,720,variante),
    cac('cacos-esq-2','Cacos esquerda 2',0,64,C,1080,-380,700,720,variante),
    rect('modulo-timer','Módulo do timer',C,0,3*C,2*R,modTimer),
    timer('timer',C,0,3*C,2*R,330,modTimer,valor),
    rect('modulo-logo','Módulo do logo',C,2*R,3*C,R,'branco'),
    img('logo-semana','Logo da Semana',SEMANA,960-lw/2,2*R+Math.round((R-lh)/2),lw,lh),
    rect('modulo-acento','Módulo de acento',4*C,0,C,R,acento),
    cac('cacos-dir','Cacos direita',4*C,R,C,2*R,20,0,640,variante)]};
}
const PESSOA_R=1034/1146;
const DEFAULTS=[
 {id:'t01',nome:'T01 · Equação',els:[
  rect('fundo','Fundo',0,0,1920,1080,'branco'),
  img('logo-semana','Logo da Semana',SEMANA,66,50,252,257),
  rect('modulo-cacos-topo','Módulo cacos (topo)',C,144,2*C,216,'azul'),
  cac('cacos-topo-1','Cacos topo',C,0,616,R,0,150,620,'escuro'),
  rect('modulo-textura','Módulo textura',3*C,0,328,R,'verde',{textura:true}),
  timer('timer',1480,0,440,R,112,'escuro','14:12'),
  rect('modulo-proposito','Módulo Propósito',0,R,C,R,'verde'),
  txt('texto-proposito','Texto Propósito',24,368,336,R,58,500,'escuro','Propósito',{valign:'center',align:'center'}),
  rect('modulo-pilares','Módulo pilares',C,R,C,R,'vclaro'),
  txt('texto-pilares','Texto pilares',C+24,368,336,R,58,500,'escuro','pilares',{valign:'center',align:'center'}),
  rect('modulo-respeito','Módulo respeito',2*C,R,C,R,'amarelo'),
  txt('texto-respeito','Texto respeito e meritocracia',2*C+48,368,288,R,42,500,'escuro','respeito<br>e'+NB+'meritocracia',{valign:'center',align:'center'}),
  op('op-mais-1','Operador + (1)',C-42,506,'+'),
  op('op-mais-2','Operador + (2)',2*C-42,506,'+'),
  rect('modulo-resultado','Módulo resultado',0,2*R,3*C,R,'azul'),
  txt('texto-resultado','Texto resultado',280,800,664,200,80,700,'branco','uma cultura forte,<br><span class="vc">do nosso jeito</span>',{valign:'center'}),
  op('op-igual','Operador =',C+C/2-42,2*R-42,'='),
  rect('modulo-acento','Módulo de acento',3*C,2*R,C,R,'medio'),
  rect('modulo-cacos-dir','Módulo cacos (dir.)',4*C,2*R,C,R,'azul'),
  cac('cacos-dir','Cacos direita',4*C,2*R,C,R,-40,120,560,'escuro'),
  rect('modulo-pessoa','Módulo atrás da foto',3*C,R,2*C,2*R,'azul'),
  ...fotoPar('CAN_9999',3*C,R,2*C,2*R,1.1,-699,-453)]},
 pilar({id:'t02',nome:'T02 · Viver pelo cliente',logo:'viver',rep:'Representa quem atendemos',acento:'medio',txtCor:'branco',bolaCor:'branco',lado:'dir',valor:'13:40',
   foto:{src:'CAN_0024',k:0.8,ix:-203,iy:-131},ys:[533,641,802],hs:[56,108,108],
   bul:['A dor do cliente é a'+NB+'nossa'+NB+'dor','Conhecemos e'+NB+'utilizamos os'+NB+'produtos e'+NB+'experiências que'+NB+'oferecemos','Superamos as'+NB+'expectativas dos'+NB+'nossos'+NB+'clientes']}),
 pilar({id:'t03',nome:'T03 · Agir como empreendedor',logo:'agir',rep:'Representa os acionistas',acento:'verde',txtCor:'escuro',bolaCor:'escuro',lado:'esq',valor:'13:22',
   fw:960,foto:{src:'CAN_0504',k:0.675,ix:-50,iy:0},ys:[480,693,854],hs:[160,108,108],
   bul:['Temos responsabilidade total com os'+NB+'resultados e'+NB+'a'+NB+'perenidade da'+NB+'empresa','Nos destacamos no'+NB+'mercado por'+NB+'excelência e'+NB+'inovação','Usamos a'+NB+'força do'+NB+'grupo para'+NB+'encontrar os'+NB+'melhores'+NB+'caminhos']}),
 pilar({id:'t04',nome:'T04 · Crescer na jornada',logo:'crescer',rep:'Representa os colaboradores',acento:'amarelo',txtCor:'escuro',bolaCor:'escuro',lado:'dir',valor:'12:58',

 {id:'t05',nome:'T05 · Respeito e meritocracia',els:[

 respiro('r1','Respiro 1','escuro','azul','medio','13:55','medio'),
 respiro('r2','Respiro 2','azul','escuro','verde','12:47','escuro'),
 respiro('r3','Respiro 3','medio','azul','amarelo','11:39','escuro'),
 {id:'buffer',nome:'Buffer (5 min)',els:[
  rect('fundo','Fundo',0,0,1920,1080,'azul'),
  rect('modulo-logo','Módulo do logo',C,0,3*C,3*R,'branco'),
  img('logo-semana','Logo da Semana',SEMANA,804,381,312,319),

// mescla o que veio do banco: só propriedades permitidas, com tipo checado (o texto nunca vem do banco)
function aplicarSalvo(t,doc){
  if(!doc||typeof doc!=='object') return;
  if(typeof doc.nota==='string') t.nota=doc.nota.slice(0,4000);
  const salvos=doc.elementos&&typeof doc.elementos==='object'?doc.elementos:{};
  for(const e of t.els){const s=salvos[e.id]; if(!s||typeof s!=='object') continue;
    for(const k of EDITAVEIS[e.tipo]){ if(!(k in s)) continue; const v=s[k];
      if(ENUM[k]){ if(ENUM[k].includes(v)) e[k]=v; }
      else if(BOOL.includes(k)){ e[k]=!!v; }
      else if(typeof v==='number'&&isFinite(v)) e[k]=Math.round(v*10)/10; } }
  if(Array.isArray(doc.ordem)){const ids=t.els.map(e=>e.id); const ok=doc.ordem.filter(i=>ids.includes(i));
    if(ok.length===ids.length){t.els.sort((a,b)=>ok.indexOf(a.id)-ok.indexOf(b.id));}}
  t.alterada=true;
}
function serializar(t){const elementos={};for(const e of t.els){const o={nome:e.nome,tipo:e.tipo};for(const k of EDITAVEIS[e.tipo]) if(e[k]!==undefined) o[k]=e[k];elementos[e.id]=o;}
  return {tela:t.id,nome:t.nome,nota:t.nota,ordem:t.els.map(e=>e.id),elementos,palco:{largura:1920,altura:1080,grade:{colunas:5,linhas:3,celula:[C,R]}}};}

// ---------- desfazer
function H(){const id=tela().id;if(!hist[id])hist[id]={pilha:[],ultimo:JSON.stringify(tela().els)};return hist[id];}
function registrar(){const h=H(),agora=JSON.stringify(tela().els);if(agora!==h.ultimo){h.pilha.push(h.ultimo);if(h.pilha.length>80)h.pilha.shift();h.ultimo=agora;}}
function desfazer(){const h=H();if(!h.pilha.length){status('pend','Nada para desfazer');return;}const prev=h.pilha.pop();h.ultimo=prev;tela().els=JSON.parse(prev);
  sel=sel.filter(id=>el(id));tela().alterada=true;render();agendar();}

// ---------- render
function renderEl(e,comSel=true){
  const d=document.createElement('div'); d.className='el'; d.dataset.id=e.id;
  Object.assign(d.style,{left:e.x+'px',top:e.y+'px',width:e.w+'px',height:e.h+'px'});
  if(e.tipo==='modulo'){d.style.background=COR[e.cor]; if(e.raio) d.style.borderRadius=e.raio+'px'; d.style.overflow='hidden';
    if(e.textura) for(let i=0;i<Math.ceil(e.h/61)+1;i++){const g=document.createElement('div');g.className='ghost';g.style.top=(-6+i*61)+'px';g.textContent='O Jeito Agi';d.appendChild(g);} }
  else if(e.tipo==='cacos'){d.style.overflow='hidden';const i=document.createElement('img');i.src=e.variante==='escuro'?'assets/cacos-escuro.svg':'assets/cacos.svg';i.alt='';i.draggable=false;
    Object.assign(i.style,{position:'absolute',left:e.ix+'px',top:e.iy+'px',width:e.iw+'px',maxWidth:'none',transform:e.flip?'scaleX(-1)':'none'});d.appendChild(i);}
  else if(e.tipo==='texto'){d.classList.add('txt');d.style.alignItems={top:'flex-start',center:'center',bottom:'flex-end'}[e.valign];
    const t=document.createElement('div');t.className='conteudo';t.innerHTML=e.html; // conteúdo fixo da redação (vem deste arquivo, nunca do banco)
    Object.assign(t.style,{color:COR[e.cor],fontSize:e.size+'px',fontWeight:e.peso,textAlign:e.align});d.appendChild(t);
    t.querySelectorAll('b').forEach(b=>b.style.fontWeight=700);}
  else if(e.tipo==='timer'){d.style.background=COR[e.fundo];d.style.display='flex';d.style.alignItems='center';d.style.justifyContent='center';
    const t=document.createElement('div');t.textContent=e.valor;Object.assign(t.style,{color:COR[e.cor],fontSize:e.size+'px',fontWeight:700,fontVariantNumeric:'tabular-nums',lineHeight:1,letterSpacing:'-.01em'});d.appendChild(t);}
  else if(e.tipo==='imagem'){const i=document.createElement('img');i.src=e.src;i.alt='';i.draggable=false;Object.assign(i.style,{width:'100%',height:'100%',display:'block',maxWidth:'none'});d.appendChild(i);}
  else if(e.tipo==='foto'){d.style.overflow='hidden';d.style.background='#333';const i=document.createElement('img');i.src='fotos/'+e.src+'.jpg';i.alt='';i.draggable=false;
    Object.assign(i.style,{width:'100%',height:'100%',objectFit:'cover',objectPosition:`${e.px}% ${e.py}%`,transform:`scale(${e.zoom/100})`,transformOrigin:`${e.px}% ${e.py}%`,display:'block',maxWidth:'none'});d.appendChild(i);}
  else if(e.tipo==='operador'){d.classList.add('op');d.style.fontSize=e.size+'px';d.textContent=e.simbolo;}
  else if(e.tipo==='fotovaza'){d.style.overflow='visible';
    const bg=document.createElement('div');Object.assign(bg.style,{position:'absolute',inset:0,overflow:'hidden',background:'#333'});
    const i1=document.createElement('img');i1.src='fotos/vaza-'+e.src+'.jpg';i1.alt='';i1.draggable=false;Object.assign(i1.style,{position:'absolute',left:e.ix+'px',top:e.iy+'px',width:e.iw+'px',maxWidth:'none'});bg.appendChild(i1);
    const lk=document.createElement('div');Object.assign(lk.style,{position:'absolute',left:-e.ve+'px',top:-e.vt+'px',width:(e.w+e.ve+e.vd)+'px',height:(e.h+e.vt+e.vb)+'px',overflow:'hidden',pointerEvents:'none'});
    const i2=document.createElement('img');i2.src='assets/vaza-'+e.src+'.png';i2.alt='';i2.draggable=false;Object.assign(i2.style,{position:'absolute',left:(e.ix+e.ve)+'px',top:(e.iy+e.vt)+'px',width:e.iw+'px',maxWidth:'none'});lk.appendChild(i2);
    d.append(bg,lk);}
  else if(e.tipo==='fotomask'){d.style.overflow='hidden';const i=document.createElement('img');i.src='fotos/vaza-'+e.src+'.jpg';i.alt='';i.draggable=false;Object.assign(i.style,{position:'absolute',left:e.ix+'px',top:e.iy+'px',width:e.iw+'px',maxWidth:'none'});d.appendChild(i);}
  else if(e.tipo==='recorte'){const i=document.createElement('img');i.src='assets/recorte-'+e.src+'.png';i.alt='';i.draggable=false;Object.assign(i.style,{width:'100%',height:'100%',display:'block',maxWidth:'none'});d.appendChild(i);}
  if(!visivel(e)) d.style.display='none';
  if(comSel&&sel.includes(e.id)){d.classList.add('sel');if(sel.length===1){const h=document.createElement('div');h.className='handle';h.dataset.handle='1';d.appendChild(h);}}
  return d;
}
function renderStageSo(){const st=$('stage');st.textContent='';for(const e of tela().els) st.appendChild(renderEl(e));

function campoNum(e,k,rot,min,max,step=1){const f=document.createElement('label');f.className='f';f.textContent=rot;const i=document.createElement('input');i.type='number';i.value=e[k];if(min!=null)i.min=min;if(max!=null)i.max=max;i.step=step;i.id='p-'+k;
  i.onchange=()=>{const v=parseFloat(i.value);if(isFinite(v)){e[k]=v;mudou();}};f.appendChild(i);return f;}
function campoSel(e,k,rot,opts){const f=document.createElement('label');f.className='f';f.textContent=rot;const s=document.createElement('select');s.id='p-'+k;
  opts.forEach(([v,t])=>{const o=document.createElement('option');o.value=v;o.textContent=t;if(String(e[k])===String(v))o.selected=true;s.appendChild(o);});
  s.onchange=()=>{e[k]=typeof e[k]==='number'?+s.value:s.value;mudou();};f.appendChild(s);return f;}
function campoChk(e,k,rot){const f=document.createElement('label');f.className='f';f.style.flexDirection='row';f.style.alignItems='center';f.style.gap='6px';const i=document.createElement('input');i.type='checkbox';i.checked=!!e[k];i.id='p-'+k;

function campoRange(e,k,rot,min,max){const f=document.createElement('label');f.className='f';const sp=document.createElement('span');sp.textContent=`${rot}: ${e[k]}`;const i=document.createElement('input');i.type='range';i.min=min;i.max=max;i.value=e[k];i.id='p-'+k;
  i.oninput=()=>{e[k]=+i.value;sp.textContent=`${rot}: ${e[k]}`;renderStageSo();};i.onchange=()=>mudou();f.append(sp,i);return f;}
function swatches(alvos,k,rot,permitidas=Object.keys(COR)){const w=document.createElement('div');const h=document.createElement('div');h.className='f';h.textContent=rot;
  const g=document.createElement('div');g.className='swatches';permitidas.forEach(c=>{const b=document.createElement('button');b.type='button';b.className='sw';b.style.background=COR[c];b.title=NOMECOR[c];b.setAttribute('aria-label',NOMECOR[c]);

function btn(txt,fn,titulo,cls=''){const b=document.createElement('button');b.type='button';b.textContent=txt;if(titulo){b.title=titulo;b.setAttribute('aria-label',titulo);}if(cls)b.className=cls;b.onclick=fn;return b;}

// alinhar / distribuir
function caixa(els){const x0=Math.min(...els.map(e=>e.x)),y0=Math.min(...els.map(e=>e.y)),x1=Math.max(...els.map(e=>e.x+e.w)),y1=Math.max(...els.map(e=>e.y+e.h));return{x0,y0,x1,y1};}
function alinhar(modo){const els=selEls();if(!els.length)return;const q=($('optQuadro')&&$('optQuadro').checked)||els.length===1;
  const b=q?{x0:0,y0:0,x1:1920,y1:1080}:caixa(els);
  for(const e of els){if(modo==='esq')e.x=b.x0;if(modo==='dir')e.x=b.x1-e.w;if(modo==='ch')e.x=Math.round((b.x0+b.x1-e.w)/2);
    if(modo==='topo')e.y=b.y0;if(modo==='base')e.y=b.y1-e.h;if(modo==='cv')e.y=Math.round((b.y0+b.y1-e.h)/2);}
  mudou();}
function distribuir(eixo){const els=selEls();if(els.length<3){status('pend','Distribuir pede 3 ou mais itens');return;}
  const P=eixo==='h'?['x','w']:['y','h'];els.sort((a,b)=>a[P[0]]-b[P[0]]);
  const ini=els[0][P[0]],fim=els[els.length-1][P[0]]+els[els.length-1][P[1]],soma=els.reduce((s,e)=>s+e[P[1]],0),gap=(fim-ini-soma)/(els.length-1);
  let p=ini;for(const e of els){e[P[0]]=Math.round(p);p+=e[P[1]]+gap;}mudou();}
function igualar(k){const els=selEls(),ref=principal();if(!ref||els.length<2)return;els.forEach(e=>e[k]=ref[k]);mudou();}

  col.appendChild(btn(els.length>1?`Excluir ${els.length} itens`:'Excluir',excluir,'Excluir (tecla Delete)','perigo'));
  P.appendChild(col);}
function mover(dir){const els=tela().els,i=els.findIndex(e=>e.id===sel[0]),j=i+dir;if(j<0||j>=els.length)return;[els[i],els[j]]=[els[j],els[i]];mudou();}
function excluir(){const els=selEls();if(!els.length)return;els.forEach(e=>e.excluido=true);status('pend',`${els.length===1?'1 item excluído':els.length+' itens excluídos'} · Ctrl+Z desfaz`);sel=[];mudou();}

// ---------- arrastar / redimensionar / caixa de seleção
let drag=null, marq=null;
const ptr=ev=>{const r=$('stagebox').getBoundingClientRect(),s=r.width/1920;return{x:(ev.clientX-r.left)/s,y:(ev.clientY-r.top)/s};};
function snap(v,ev,passo){if(ev.altKey||!$('optIma').checked) return Math.round(v);const g=Math.round(v/passo)*passo;return Math.abs(g-v)<=22?g:Math.round(v/8)*8;}
const multi=ev=>ev.shiftKey||ev.metaKey||ev.ctrlKey;
$('stagebox').addEventListener('pointerdown',ev=>{
  const p=ptr(ev);const alvo=ev.target.closest('.el');const id=alvo&&alvo.dataset.id;
  if(ev.target.dataset.handle){const e=principal();drag={modo:'res',e,ox:p.x,oy:p.y,w:e.w,h:e.h};}
  else if(alvo&&id!=='fundo'){
    if(multi(ev)){ if(sel.includes(id)){sel=sel.filter(i=>i!==id);render();return;} sel=[...sel,id]; }
    else if(!sel.includes(id)) sel=[id];
    else sel=[...sel.filter(i=>i!==id),id];
    drag={modo:'mov',ox:p.x,oy:p.y,orig:selEls().map(e=>({e,x:e.x,y:e.y}))};render();}
  else{ marq={x0:p.x,y0:p.y,x1:p.x,y1:p.y,base:multi(ev)?[...sel]:[],fundo:id==='fundo'}; if(!multi(ev)) sel=[]; render(); }
  $('stagebox').setPointerCapture(ev.pointerId);ev.preventDefault();});
$('stagebox').addEventListener('pointermove',ev=>{const p=ptr(ev);
  if(marq){marq.x1=p.x;marq.y1=p.y;const x0=Math.min(marq.x0,p.x),x1=Math.max(marq.x0,p.x),y0=Math.min(marq.y0,p.y),y1=Math.max(marq.y0,p.y);
    const dentro=tela().els.filter(e=>e.id!=='fundo'&&visivel(e)&&e.x<x1&&e.x+e.w>x0&&e.y<y1&&e.y+e.h>y0).map(e=>e.id);
    sel=[...new Set([...marq.base,...dentro])];renderStageSo();return;}
  if(!drag)return;
  if(drag.modo==='mov'){const pr=drag.orig[drag.orig.length-1];const nx=snap(pr.x+p.x-drag.ox,ev,C),ny=snap(pr.y+p.y-drag.oy,ev,R);const dx=nx-pr.x,dy=ny-pr.y;
    drag.orig.forEach(o=>{o.e.x=o.x+dx;o.e.y=o.y+dy;});}
  else{const e=drag.e;const nx=snap(e.x+drag.w+p.x-drag.ox,ev,C)-e.x,ny=snap(e.y+drag.h+p.y-drag.oy,ev,R)-e.y;e.w=Math.max(8,nx);e.h=Math.max(8,ny);
    if((e.tipo==='imagem'||e.tipo==='recorte')&&!ev.shiftKey){const r=drag.w/drag.h;e.h=Math.round(e.w/r);}}
  renderStageSo();});
$('stagebox').addEventListener('pointerup',()=>{
  if(marq){const clique=Math.abs(marq.x1-marq.x0)<4&&Math.abs(marq.y1-marq.y0)<4;if(clique&&marq.fundo&&!marq.base.length)sel=['fundo'];marq=null;render();return;}
  if(drag){const mexeu=drag.modo==='mov'?drag.orig.some(o=>o.e.x!==o.x||o.e.y!==o.y):(drag.e.w!==drag.w||drag.e.h!==drag.h);drag=null;if(mexeu)mudou();else render();}});
document.addEventListener('keydown',ev=>{
  if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;
  const k=ev.key.toLowerCase();
  if((ev.ctrlKey||ev.metaKey)&&k==='z'){ev.preventDefault();desfazer();return;}
  if((ev.ctrlKey||ev.metaKey)&&k==='a'){ev.preventDefault();sel=tela().els.filter(e=>e.id!=='fundo'&&visivel(e)).map(e=>e.id);render();return;}
  if(ev.key==='Escape'){sel=[];render();return;}
  if(!sel.length)return;
  if(ev.key==='Delete'||ev.key==='Backspace'){ev.preventDefault();excluir();return;}
  const d=ev.shiftKey?10:1;const m={ArrowLeft:[-d,0],ArrowRight:[d,0],ArrowUp:[0,-d],ArrowDown:[0,d]}[ev.key];if(!m)return;ev.preventDefault();
  selEls().forEach(e=>{e.x+=m[0];e.y+=m[1];});mudou();});
$('optGrade').onchange=render;
$('btnDesfazer').onclick=desfazer;
$('nota').addEventListener('input',()=>{tela().nota=$('nota').value;tela().alterada=true;agendar();});

// ---------- salvar
let timerSalvar=null;
function status(cls,txt){$('status').className='status '+cls;$('statusTxt').textContent=txt;}
function mudou(){registrar();tela().alterada=true;render();agendar();}
function agendar(){if(!db){status('err','Sem banco: use “Copiar JSON da tela”');return;}clearTimeout(timerSalvar);const t=tela();timerSalvar=setTimeout(()=>salvar(t),1200);}
let salvando=Promise.resolve();
function salvar(t){salvando=salvando.then(async()=>{try{await db.doc('ajustes/'+t.id).set({...serializar(t),salvoEm:new Date().toISOString()});status('ok','Salvo');}
  catch(err){status('err','Não salvou ('+(err&&err.code||'erro')+'). Use “Copiar JSON da tela”.');}});}
$('btnCopiar').onclick=()=>{const s=JSON.stringify(serializar(tela()),null,1);
  navigator.clipboard.writeText(s).then(()=>status(db?'ok':'pend','JSON copiado: cole no chat')).catch(()=>{const ta=document.createElement('textarea');ta.value=s;ta.readOnly=true;ta.style.minHeight='160px';$('pCampos').prepend(ta);ta.select();status('pend','Selecionei o JSON no painel: copie com Ctrl+C');});};
function resetBotao(){const box=$('resetBox');box.textContent='';box.appendChild(btn('Restaurar esta tela',resetPergunta));}
function resetPergunta(){const box=$('resetBox');box.textContent='';const s=document.createElement('span');s.textContent='Voltar esta tela ao frame style v5?';
  box.append(s,btn('Restaurar',()=>{const d=clone(DEFAULTS[atual]);tela().els=d.els;sel=[];resetBotao();mudou();},null,'prim'),btn('Cancelar',resetBotao));}
resetBotao();

// ---------- início
window.__exportarLayout=()=>JSON.parse(JSON.stringify(telas.map(t=>({id:t.id,nome:t.nome,els:t.els.filter(e=>!e.excluido&&!e.oculto)}))));
render();
(async()=>{
  const c=window.claude; if(!c||!c.use){status('err','Abra no claude.ai para salvar. Use “Copiar JSON da tela”.');return;}
  const tempo=setTimeout(()=>status('err','Banco não respondeu: use “Copiar JSON da tela”'),10000);
  try{db=await c.use('db');}catch{db=null;}
  if(!db){clearTimeout(tempo);status('err','Sem banco: use “Copiar JSON da tela”');return;}
  try{const snap=await db.collection('ajustes').get();clearTimeout(tempo);
    const docs=snap&&snap.docs?snap.docs:[];for(const d of docs){const t=telas.find(x=>x.id===d.id);if(t&&d.exists!==false)aplicarSalvo(t,d.data());}
    for(const k in hist) delete hist[k];
    status('ok',docs.length?'Ajustes carregados':'Pronto · nada salvo ainda');render();}
  catch(err){clearTimeout(tempo);status('pend','Não li os ajustes salvos ('+(err&&err.code||'erro')+')');}
})();
})();
</script>
